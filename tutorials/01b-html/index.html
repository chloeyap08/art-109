<h2>Responsive images using srcset</h2>
<img src="images/axolotl/axolotl-fallback.jpg" width="800" alt="axolotl in a tank." 
srcset="images/axolotl/axolotl-640.jpg 640w,
        images/axolotl/axolotl-1280.jpg 1280w,
        images/axolotl/axolotl-1920.jpg 1920w">
</section>
</section>
<img src="images/chicken/chicken-fallback.jpeg" width="800" alt="chicken in a coop." 
srcset="images/chicken/chicken-640.jpeg 640w,
        images/chicken/chicken-1280.jpeg 1280w,
        images/chicken/chicken-1920.jpeg 1920w">
</section>
</section>
<img src="images/owl/owl-fallback.jpeg" width="800" alt="owl in a tree." 
srcset="images/owl/owl-640.jpeg 640w,
        images/owl/owl-1280.jpeg 1280w,
        images/owl/owl-1920.jpeg 1920w">
</section>
